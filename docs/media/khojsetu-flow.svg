<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" role="img" aria-label="Two local field units exchange approved records through a gateway and Qdrant Server"><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#283c32}.wire{fill:none;stroke:#b4beae;stroke-width:3}.node rect{fill:#fcfaf4;stroke:#b8c4b0;stroke-width:2}.active rect{fill:#e3ecd8;stroke:#aa5137;stroke-width:4}.wire.active{stroke:#aa5137;stroke-dasharray:9 6;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}@media(prefers-reduced-motion:reduce){.wire.active{animation:none}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#85947b"/></marker></defs><rect width="1600" height="850" fill="#f3f0e6"/><text x="40" y="55" font-size="36" font-weight="700">KhojSetu / memory that travels with the team</text><text x="40" y="94" font-size="21">Remember locally. Share selectively. Keep working when disconnected.</text><rect x="30" y="145" width="470" height="655" rx="16" fill="#e6ebdf" stroke="#c5cdbb"/><text x="50" y="180" font-size="18" font-weight="700">FIELD UNIT A / LOCAL EDGE</text><rect x="560" y="145" width="480" height="655" rx="16" fill="#eee3d5" stroke="#c5cdbb"/><text x="580" y="180" font-size="18" font-weight="700">SHARED TEAM ARCHIVE</text><rect x="1100" y="145" width="470" height="655" rx="16" fill="#e6ebdf" stroke="#c5cdbb"/><text x="1120" y="180" font-size="18" font-weight="700">FIELD UNIT B / LOCAL EDGE</text><text x="590" y="235" font-size="21">Connection needed only for exchange</text><text x="590" y="267" font-size="17">Demo: gateway + server hosted locally</text><path id="e-capture" class="wire" d="M265 286 L265 310" marker-end="url(#arrow)"/><path id="e-embed" class="wire" d="M265 386 L265 410" marker-end="url(#arrow)"/><path id="e-remember" class="wire" d="M265 486 L265 510" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path id="e-photo" class="wire" d="M60 248 L48 248 L48 648 L60 648" marker-end="url(#arrow)"/><path id="e-approval" class="wire" d="M470 548 L490 548 L490 743 L470 743" marker-end="url(#arrow)"/><path id="e-send" class="wire" d="M470 743 L530 743 L530 365 L590 365" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path id="e-index" class="wire" d="M800 420 L800 465" marker-end="url(#arrow)"/><path id="e-attachments" class="wire" d="M1010 390 L1040 390 L1040 656 L1010 656" marker-end="url(#arrow)"/><path id="e-receive" class="wire" d="M1010 340 L1080 340 L1080 743 L1130 743" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path id="e-store" class="wire" d="M1540 743 L1552 743 L1552 548 L1540 548" marker-end="url(#arrow)"/><path id="e-bindex" class="wire" d="M1335 510 L1335 486" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path id="e-bembed" class="wire" d="M1335 386 L1335 410" marker-end="url(#arrow)"/><path id="e-bquery" class="wire" d="M1335 286 L1335 310" marker-end="url(#arrow)"/><g id="n-aui" class="node"><rect x="60" y="210" width="410" height="76" rx="9"/><text x="75" y="239" font-size="22" font-weight="600">Field notebook + FastAPI</text><text x="75" y="263" font-size="16">Notes / camera / museum references</text></g><g id="n-amodel" class="node"><rect x="60" y="310" width="410" height="76" rx="9"/><text x="75" y="339" font-size="22" font-weight="600">Local MiniLM embeddings</text><text x="75" y="363" font-size="16">Text to 384 numbers; cached on device</text></g><g id="n-aedge" class="node"><rect x="60" y="410" width="410" height="76" rx="9"/><text x="75" y="439" font-size="22" font-weight="600">Qdrant Edge</text><text x="75" y="463" font-size="16">Dense + lexical retrieval; hybrid ranking</text></g><g id="n-ajournal" class="node"><rect x="60" y="510" width="410" height="76" rx="9"/><text x="75" y="539" font-size="22" font-weight="600">SQLite journal</text><text x="75" y="563" font-size="16">Records / revisions / durable outbox</text></g><g id="n-aphoto" class="node"><rect x="60" y="610" width="410" height="76" rx="9"/><text x="75" y="639" font-size="22" font-weight="600">Local photo files</text><text x="75" y="663" font-size="16">Compressed JPEG / EXIF removed / dedup</text></g><g id="n-apolicy" class="node"><rect x="60" y="710" width="410" height="66" rx="9"/><text x="75" y="739" font-size="22" font-weight="600">Policy + resource controls</text><text x="75" y="763" font-size="16">Approval / privacy / storage / selection</text></g><g id="n-bui" class="node"><rect x="1130" y="210" width="410" height="76" rx="9"/><text x="1145" y="239" font-size="22" font-weight="600">Field notebook + FastAPI</text><text x="1145" y="263" font-size="16">Notes / camera / museum references</text></g><g id="n-bmodel" class="node"><rect x="1130" y="310" width="410" height="76" rx="9"/><text x="1145" y="339" font-size="22" font-weight="600">Local MiniLM embeddings</text><text x="1145" y="363" font-size="16">Text to 384 numbers; cached on device</text></g><g id="n-bedge" class="node"><rect x="1130" y="410" width="410" height="76" rx="9"/><text x="1145" y="439" font-size="22" font-weight="600">Qdrant Edge</text><text x="1145" y="463" font-size="16">Dense + lexical retrieval; hybrid ranking</text></g><g id="n-bjournal" class="node"><rect x="1130" y="510" width="410" height="76" rx="9"/><text x="1145" y="539" font-size="22" font-weight="600">SQLite journal</text><text x="1145" y="563" font-size="16">Records / revisions / durable outbox</text></g><g id="n-bphoto" class="node"><rect x="1130" y="610" width="410" height="76" rx="9"/><text x="1145" y="639" font-size="22" font-weight="600">Local photo files</text><text x="1145" y="663" font-size="16">Compressed JPEG / EXIF removed / dedup</text></g><g id="n-bpolicy" class="node"><rect x="1130" y="710" width="410" height="66" rx="9"/><text x="1145" y="739" font-size="22" font-weight="600">Policy + resource controls</text><text x="1145" y="763" font-size="16">Approval / privacy / storage / selection</text></g><g id="n-gateway" class="node"><rect x="590" y="310" width="420" height="110" rx="9"/><text x="605" y="339" font-size="22" font-weight="600">Version-aware exchange gateway</text><text x="605" y="363" font-size="16">Manual or opt-in background exchange</text><text x="605" y="385" font-size="16">Receipts / retries / conflicts / withdrawals</text></g><g id="n-server" class="node"><rect x="590" y="465" width="420" height="92" rx="9"/><text x="605" y="494" font-size="22" font-weight="600">Qdrant Server</text><text x="605" y="518" font-size="16">Shared dense + sparse vectors</text><text x="605" y="540" font-size="16">Approved record metadata</text></g><g id="n-blobs" class="node"><rect x="590" y="610" width="420" height="92" rx="9"/><text x="605" y="639" font-size="22" font-weight="600">Gateway journal + photo files</text><text x="605" y="663" font-size="16">Revision history / separate attachments</text><text x="605" y="685" font-size="16">64 KiB chunks / SHA-256 verification</text></g><text x="40" y="830" font-size="17">Two physical laptops require LAN setup and rehearsal. Each field unit runs its own local backend, model and Edge shard.</text></svg>